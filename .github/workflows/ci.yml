name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci-deps
      - run: vp run typecheck
      - run: vp lint

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci-deps
      - name: Sandbox and browser
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap libsecret-1-dev
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          node e2e/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - run: vp test run --root e2e --shard ${{ matrix.shard }}/3
        env:
          OZI_E2E_RESULTS: results-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-results-${{ matrix.shard }}
          path: e2e/results-${{ matrix.shard }}.json

  features:
    needs: e2e
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci-deps
      - uses: actions/download-artifact@v5
        with:
          pattern: e2e-results-*
          path: e2e
          merge-multiple: true
      - run: node scripts/features.ts check 4
