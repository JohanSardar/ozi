requirements:
  main-pi: Main runs on Pi with Claude Opus 5.5, high effort, fast off.
  main-delegates: Main never does the work; answers only from what it knows; always responsive.
  firstmate: One contact; full briefs; confirm start; relay changes; supervise; report outcomes; surface findings, blockers, logins, risks at once; batch routine.
  one-job-per-outcome: One job per outcome; related work together, unrelated apart.
  prompt: Core prompt ≤400 words with an empty ADHD slot; domain know-how in skills loaded when relevant.
  workers: Default worker Codex gpt-6.1-sol xhigh Fast; Claude or Pi when suited; async; results to main and panel.
  other-machines: Workers reach other computers over plain SSH.
  does-it-itself: Workers handle codes, saved passwords and "I'm not a robot"; the user gets only passkeys, Face ID, puzzle CAPTCHAs, sensitive approvals; no CAPTCHA solvers.
  end-of-turn-check: Every claimed completion forks a check; gaps continue; silent otherwise.
  blocked: Three rounds without progress post a Blocked card.
  mistake-log: Every mistake is one SQLite row with what and why.
  repair-trigger: A fix is made only on user correction or a repeat.
  replay: Fixes are tested by replaying from before the mistake with faked effects and an observer; pass ships, recurrence undoes.
  protected: Self-repair can't change approvals, contacts rule, test cases, credentials.
  user-override: The user can change any rule by asking; Ozi never refuses the user.
  info-tools: Agents call tools on demand (MCP, CLI).
  schedules: Scheduled jobs by interval, time of day and webhook.
  watchers: Live watchers wake main.
  quiet-cards: A scheduled run makes a card only if it needs the user or has something worth reading.
  memory-plugin: Ozi doesn't depend on or write to memory.
  desktop-remote: Desktop app on the laptop; server on another machine.
  one-conversation: One main conversation; no thread list.
  card-columns: One card per job in Running, Needs you, Ready, Done.
  on-cards: Questions and reports live on the card, never only in the scroll.
  card-leaves: A card leaves when closed or clearly handled.
  drawer: Clicking a card opens the worker conversation in a drawer.
  todos: The panel shows the user's external to-dos, clearly marked.
  t3-keep: Keep chat (attachments, steer/queue, stop), approval/question cards, delegation, scheduler, webhooks, secret entry, shared browser, visual replies, desktop shell, Pi/Claude/Codex adapters.
  provider-scope: Only Pi, Claude and Codex providers ship.
  client-scope: Only desktop and web clients ship.
  t3-cut: Cut other providers, thread list, projects, worktrees, PR tools, checkpoints, diffs, simulators, terminal, T3 coding instructions.
  minimal: Fewest words and least code.
  for-everybody: No user-specific paths or accounts in code; public repo ozi.

features:
  - id: cli
    reqs: [info-tools, for-everybody]
    module: apps/server/src/cli/client.ts + e2e
    cli: [serve, service, pair, status, say, steer, stop, thread, wait]
    milestone: 1
    scenarios: [m1.cli-json]
    status: passing
  - id: providers-trimmed
    reqs: [t3-cut, t3-keep, memory-plugin, provider-scope, client-scope]
    module: server
    cli: [status]
    milestone: 1
    scenarios: [m1.fresh-install]
    status: passing
  - id: main-loadout
    reqs: [main-pi, prompt, main-delegates, does-it-itself]
    module: ozi/Loadout.ts
    cli: [status, thread]
    milestone: 1
    scenarios: [m1.main-loadout, m1.main-cannot-execute]
    status: passing
  - id: delegation
    reqs: [workers, firstmate, other-machines, main-delegates]
    module: main
    cli: [say, thread]
    milestone: 1
    scenarios: [m1.delegate-async, m1.responsive, m1.worker-choice]
    status: passing
  - id: chat-controls
    reqs: [t3-keep]
    module: server
    cli: [say, steer, stop]
    milestone: 1
    scenarios: [m1.attachments, m1.steer-queue-stop]
    status: passing
  - id: skills
    reqs: [prompt, info-tools]
    module: ozi/Skills.ts
    cli: [say]
    milestone: 1
    scenarios: [m1.read-skill]
    status: passing
  - id: remote-client
    reqs: [desktop-remote]
    module: web
    cli: [pair]
    milestone: 1
    scenarios: [m1.remote-client]
    status: passing
  - id: job-cards
    reqs: [one-job-per-outcome, card-columns]
    module: ozi/Jobs.ts
    cli: [jobs, job, close, wait]
    milestone: 2
    scenarios:
      [
        m2.lead-card,
        m2.helper-same-job,
        m2.second-outcome,
        m2.followup-lead,
        m2.awaits-check,
        m2.main-without-worker,
        m2.restart,
      ]
    status: passing
  - id: card-requests
    reqs: [on-cards, does-it-itself]
    module: ozi/Jobs.ts
    cli: [answer]
    milestone: 2
    scenarios: [m2.question-card, m2.approval-card, m2.secret-card]
    status: passing
  - id: panel
    reqs: [one-conversation, drawer, card-columns]
    module: apps/web/src/components/ozi + e2e/m2.ui.test.ts
    cli: [jobs]
    milestone: 2
    scenarios: [m2.drawer, m2.no-thread-list]
    status: passing
  - id: completion-check
    reqs: [end-of-turn-check]
    module: Completion
    cli: [checks, wait]
    milestone: 3
    scenarios:
      [
        m3.worker-done,
        m3.continue,
        m3.main-checked,
        m3.no-recursion,
        m3.fork-intact,
        m3.bad-verdict,
        m3.steer-supersedes,
        m3.stop-unchecked,
        m3.needs-user,
        m3.recovery,
      ]
    status: passing
  - id: blocked
    reqs: [blocked]
    module: Completion
    cli: [checks, jobs]
    milestone: 3
    scenarios: [m3.blocked, m3.progress-resets]
    status: passing
  - id: card-handling
    reqs: [card-leaves]
    module: Jobs
    cli: [close, stop, answer]
    milestone: 3
    scenarios: [m3.close-exact, m3.accept-closes, m3.close-vs-stop]
    status: passing
  - id: schedules
    reqs: [schedules, quiet-cards]
    module: scheduledTasks/ScheduledTaskService.ts + ozi/Clock.ts + cli/client.ts + e2e/m4.test.ts
    cli: [schedules, schedule]
    milestone: 4
    scenarios: [m4.interval, m4.time-of-day, m4.useful-card]
    status: passing
  - id: webhooks
    reqs: [watchers]
    module: scheduledTasks + e2e/m4.test.ts
    cli: [schedule]
    milestone: 4
    scenarios: [m4.webhook, m4.base-url]
    status: passing
  - id: todos
    reqs: [todos]
    module: ozi/Todos.ts + components/ozi/JobPanel.tsx + e2e/m4.test.ts
    cli: [todos]
    milestone: 4
    scenarios: [m4.todos]
    status: passing
  - id: cut-coding
    reqs: [t3-cut, minimal]
    module: server + contracts + client-runtime + web + desktop + packages + packaging + infra + reference-repos + connection
    cli: []
    milestone: 4
    scenarios: [m4.removed]
    status: planned
  - id: mistake-log
    reqs: [mistake-log]
    module: apps/server/src/ozi/Repair.ts
    cli: [mistakes, mistake]
    milestone: 5
    scenarios: [m5.log, m5.no-repair-once]
    status: passing
  - id: replay
    reqs: [repair-trigger, replay]
    module: apps/server/src/ozi/Repair.ts + RepairSandbox.ts + RepairTasks.ts
    cli: [replays]
    milestone: 5
    scenarios: [m5.correction-repairs, m5.repeat-repairs, m5.false-case, m5.unknown-effect]
    status: passing
  - id: confinement
    reqs: [protected, user-override]
    module: apps/server/src/ozi/RepairSandbox.ts + RepairProgram.ts
    cli: [replays]
    milestone: 5
    scenarios: [m5.protected-denied, m5.no-credentials, m5.user-override]
    status: passing
  - id: publish-undo
    reqs: [replay]
    module: Repair
    cli: [fixes, undo]
    milestone: 6
    scenarios: [m6.publish, m6.recurrence-undo, m6.edit-conflict, m6.crash-publish]
    status: planned
  - id: public-ready
    reqs: [for-everybody, minimal, t3-cut]
    module: repo
    cli: []
    milestone: 6
    scenarios: [m6.audit, m6.public-ready]
    status: planned
