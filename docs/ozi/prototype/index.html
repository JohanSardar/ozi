<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ozi — prototype</title>
<style>
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "Inter Variable", "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  --radius: 8px;
  --radius-sm: calc(var(--radius) - 2px);
  --radius-lg: calc(var(--radius) + 2px);
  --radius-xl: calc(var(--radius) + 4px);
  --chat-width: 46rem;
  --sidebar-width: 264px;
  --inbox-width: 404px;
  --topbar: 52px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
:root[data-mode="dark"] {
  color-scheme: dark;
  --bg: #000000;
  --sidebar: #101010;
  --surface: #0f0f0f;
  --raised: #151515;
  --overlay: #121212;
  --text: #f5f5f5;
  --muted: #a3a3a3;
  --faint: #6b6b6b;
  --border: rgba(255,255,255,.08);
  --border-strong: rgba(255,255,255,.14);
  --input: rgba(255,255,255,.11);
  --hover: rgba(255,255,255,.045);
  --selected: rgba(255,255,255,.07);
  --accent: oklch(0.571 0.21 264);
  --accent-fg: #ffffff;
  --accent-soft: color-mix(in srgb, var(--accent) 16%, transparent);
  --message: #1c1c1c;
  --code: #161616;
  --success: #34d399;
  --warning: #fbbf24;
  --error: #f87171;
  --info: #60a5fa;
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 40px rgba(0,0,0,.55);
  --backdrop: rgba(0,0,0,.6);
}
:root[data-mode="light"] {
  color-scheme: light;
  --bg: #fcfcfc;
  --sidebar: #f7f7f8;
  --surface: #ffffff;
  --raised: #ffffff;
  --overlay: #ffffff;
  --text: #18181b;
  --muted: #71717a;
  --faint: #a1a1aa;
  --border: #e7e7ea;
  --border-strong: #d4d4d8;
  --input: #d9d9de;
  --hover: rgba(24,24,27,.04);
  --selected: rgba(24,24,27,.065);
  --accent: oklch(0.488 0.217 264);
  --accent-fg: #ffffff;
  --accent-soft: color-mix(in srgb, var(--accent) 10%, transparent);
  --message: #f0f0f2;
  --code: #f4f4f5;
  --success: #059669;
  --warning: #d97706;
  --error: #dc2626;
  --info: #2563eb;
  --shadow: 0 12px 40px rgba(24,24,27,.14), 0 1px 3px rgba(24,24,27,.06);
  --backdrop: rgba(24,24,27,.32);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 14px/1.5 var(--font-sans);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
textarea, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-sm); }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--font-mono); }
.caps { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; }
.kbd { font-family: var(--font-mono); font-size: 11px; color: var(--muted); border: 1px solid var(--border-strong); border-radius: 4px; min-width: 20px; height: 20px; padding: 0 5px; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.app { height: 100vh; display: grid; grid-template-rows: minmax(0, 1fr); grid-template-columns: var(--sidebar-width) minmax(0, 1fr) var(--inbox-width); transition: grid-template-columns .22s var(--ease); }
.app.no-inbox { grid-template-columns: var(--sidebar-width) minmax(0, 1fr) 0px; }
.app.no-sidebar { grid-template-columns: 0px minmax(0, 1fr) var(--inbox-width); }
.app.no-sidebar.no-inbox { grid-template-columns: 0px minmax(0, 1fr) 0px; }

.traffic { position: fixed; top: 18px; left: 18px; display: flex; gap: 8px; z-index: 100; }
.traffic span { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.25); }
.traffic span:nth-child(1) { background: #ff5f57; }
.traffic span:nth-child(2) { background: #febc2e; }
.traffic span:nth-child(3) { background: #28c840; }

.icon-btn { width: 30px; height: 30px; border-radius: var(--radius-sm); display: inline-flex; align-items: center; justify-content: center; color: var(--muted); transition: background .12s, color .12s; position: relative; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn.sm { width: 26px; height: 26px; }
.icon-btn .badge { position: absolute; top: 2px; right: 1px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); font: 600 10px/15px var(--font-sans); text-align: center; }

.sidebar { background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.sb-top { height: var(--topbar); flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 2px; padding: 0 10px 0 88px; }
.sb-search { margin: 2px 10px 6px; height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; border-radius: var(--radius-sm); background: var(--hover); border: 1px solid transparent; color: var(--muted); transition: border-color .12s, background .12s; }
.sb-search:focus-within { border-color: var(--input); background: var(--surface); }
.sb-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 13.5px; }
.sb-search input::placeholder { color: var(--muted); }
.sb-new { margin: 0 10px 4px; height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: var(--radius-sm); color: var(--text); font-size: 13.5px; font-weight: 500; }
.sb-new:hover { background: var(--hover); }
.sb-new .kbd { margin-left: auto; }
.sb-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px 12px; }
.sb-label { padding: 14px 10px 6px; color: var(--faint); }
.chat-row { width: 100%; height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: var(--radius-sm); color: var(--muted); font-size: 13.5px; text-align: left; transition: background .12s, color .12s; }
.chat-row:hover { background: var(--hover); color: var(--text); }
.chat-row.active { background: var(--selected); color: var(--text); }
.chat-row .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-row .time { color: var(--faint); font-size: 12px; flex: none; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot.working { background: var(--accent); box-shadow: 0 0 0 0 var(--accent); animation: pulse 1.6s infinite; }
.dot.needs { background: var(--warning); }
.dot.blank { background: transparent; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.sb-bottom { flex: none; border-top: 1px solid var(--border); padding: 8px 10px; display: flex; align-items: center; gap: 8px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #6d8bff, #b06dff); color: #fff; font-weight: 600; font-size: 12px; display: flex; align-items: center; justify-content: center; flex: none; }
.sb-bottom .who { flex: 1; min-width: 0; font-size: 13px; }
.sb-bottom .who small { display: block; color: var(--faint); font-size: 11.5px; }

.main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.topbar { height: var(--topbar); flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 20px; border-bottom: 1px solid transparent; }
.app.no-sidebar .topbar { padding-left: 96px; }
.topbar .title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status-pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); }
.status-pill .dot { width: 6px; height: 6px; }
.topbar .spacer { flex: 1; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; scroll-behavior: smooth; }
.column { max-width: calc(var(--chat-width) + 48px); margin: 0 auto; padding: 24px 24px 40px; }
.msg { margin: 0 0 22px; }
.msg.user { display: flex; flex-direction: column; align-items: flex-end; }
.bubble { max-width: min(80%, 34rem); background: var(--message); padding: 10px 14px; border-radius: var(--radius-lg); font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble .quote { display: flex; gap: 8px; align-items: flex-start; margin: -2px 0 8px; padding: 6px 10px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--text) 6%, transparent); color: var(--muted); font-size: 12.5px; line-height: 1.45; white-space: normal; }
.bubble .quote svg { margin-top: 2px; }
.bubble .quote b { color: var(--text); font-weight: 600; }
.user-meta { margin-top: 5px; color: var(--faint); font-size: 11.5px; display: flex; gap: 8px; align-items: center; }
.attach-row { display: flex; gap: 8px; margin-bottom: 8px; justify-content: flex-end; }
.thumb { width: 132px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); background: var(--raised); }
.thumb .img { height: 84px; background: radial-gradient(circle at 30% 30%, #f3e7d3, #c9b48f 60%, #8a7553); display: flex; align-items: center; justify-content: center; }
.thumb .img .paper { width: 46px; height: 64px; background: #fffdf7; border-radius: 2px; box-shadow: 0 2px 8px rgba(0,0,0,.25); transform: rotate(-4deg); padding: 6px 5px; display: flex; flex-direction: column; gap: 3px; }
.thumb .img .paper i { display: block; height: 2px; background: #c9c3b6; border-radius: 1px; }
.thumb .cap { padding: 6px 8px; font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }

.say { font-size: 14.5px; line-height: 1.68; position: relative; }
.say p { margin: 0 0 10px; }
.say p:last-child { margin-bottom: 0; }
.say ul { margin: 4px 0 10px; padding-left: 20px; }
.say li { margin: 3px 0; }
.say strong { font-weight: 600; }
.say code { font-family: var(--font-mono); font-size: 12.5px; background: var(--code); border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px; }
.msg-actions { display: flex; gap: 2px; margin-top: 6px; opacity: 0; transition: opacity .12s; }
.msg.assistant:hover .msg-actions, .msg-actions:focus-within { opacity: 1; }
.act { height: 26px; padding: 0 8px; border-radius: var(--radius-sm); display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
.act:hover { background: var(--hover); color: var(--text); }
.act svg.i { width: 14px; height: 14px; }

.work { margin: 0 0 10px; }
.work-toggle { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px 0 6px; margin-left: -6px; border-radius: var(--radius-sm); color: var(--muted); font-size: 13px; }
.work-toggle:hover { background: var(--hover); color: var(--text); }
.work-toggle .chev { transition: transform .15s var(--ease); width: 14px; height: 14px; }
.work.open > .work-toggle .chev { transform: rotate(90deg); }
.work.running .work-toggle { color: var(--text); }
.shimmer { background: linear-gradient(90deg, var(--muted) 0%, var(--text) 40%, var(--muted) 80%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.8s linear infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.steps { display: none; margin: 4px 0 2px; padding-left: 2px; border-left: 1px solid var(--border); }
.work.open .steps { display: block; }
.step { margin-left: 10px; }
.step-row { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 28px; padding: 2px 6px; border-radius: var(--radius-sm); color: var(--muted); font-size: 13px; text-align: left; }
.step-row:hover { background: var(--hover); color: var(--text); }
.step-row .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step-row .label b { color: var(--text); font-weight: 500; }
.step-row .meta { color: var(--faint); font-size: 12px; }
.step-detail { display: none; margin: 2px 6px 8px 30px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--code); border: 1px solid var(--border); font: 12px/1.55 var(--font-mono); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.step.open .step-detail { display: block; }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--text) 18%, transparent); border-top-color: var(--text); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

.job-chip { display: inline-flex; align-items: center; gap: 10px; margin: 12px 0 2px; padding: 8px 12px 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); font-size: 13px; max-width: 100%; transition: border-color .12s, background .12s; }
.job-chip:hover { border-color: var(--border-strong); background: var(--raised); }
.job-chip .jt { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.job-chip .js { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.job-chip .ico { width: 24px; height: 24px; border-radius: 6px; background: var(--hover); display: flex; align-items: center; justify-content: center; color: var(--muted); flex: none; }

.note { display: flex; align-items: center; gap: 8px; margin: -6px 0 22px; color: var(--faint); font-size: 12.5px; }
.note svg.i { width: 14px; height: 14px; }
.note .t { color: var(--muted); }
.note.closed svg { color: var(--success); }

.dock { flex: none; position: relative; padding: 0 24px 18px; }
.dock::before { content: ""; position: absolute; left: 0; right: 0; top: -28px; height: 28px; background: linear-gradient(to bottom, transparent, var(--bg)); pointer-events: none; }
.dock-inner { max-width: var(--chat-width); margin: 0 auto; }
.queued { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; margin-bottom: 10px; }
.q-item { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; max-width: min(80%, 30rem); }
.q-bubble { padding: 8px 12px; border-radius: var(--radius-lg); border: 1px dashed var(--border-strong); color: var(--muted); font-size: 14px; }
.q-meta { display: flex; align-items: center; gap: 2px; color: var(--faint); font-size: 11.5px; }
.q-meta .lbl { display: inline-flex; align-items: center; gap: 5px; margin-right: 6px; }
.q-meta .act { height: 22px; font-size: 11.5px; padding: 0 6px; }

.composer { border: 1px solid var(--input); background: var(--surface); border-radius: var(--radius-xl); box-shadow: 0 1px 2px rgba(0,0,0,.04); transition: border-color .12s, box-shadow .12s; }
.composer:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, var(--input)); box-shadow: 0 0 0 3px var(--accent-soft); }
.reply-chip { display: flex; align-items: flex-start; gap: 8px; margin: 10px 10px 0; padding: 8px 10px; border-radius: var(--radius); background: var(--hover); border-left: 2px solid var(--accent); font-size: 12.5px; color: var(--muted); }
.reply-chip .txt { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.reply-chip b { color: var(--text); font-weight: 600; }
.composer textarea { display: block; width: 100%; resize: none; border: 0; outline: 0; background: none; padding: 14px 16px 6px; font-size: 14.5px; line-height: 1.5; min-height: 52px; max-height: 240px; }
.composer textarea::placeholder { color: var(--faint); }
.composer-foot { display: flex; align-items: center; gap: 4px; padding: 6px 8px 8px; }
.pill-btn { height: 30px; padding: 0 10px; border-radius: var(--radius-sm); display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.pill-btn:hover { background: var(--hover); color: var(--text); }
.pill-btn svg.i { width: 14px; height: 14px; }
.composer-foot .grow { flex: 1; }
.hint { color: var(--faint); font-size: 12px; margin-right: 8px; white-space: nowrap; }
.send { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--accent); color: var(--accent-fg); transition: transform .1s, opacity .12s, background .12s; }
.send:hover { filter: brightness(1.08); }
.send:active { transform: scale(.94); }
.send:disabled { opacity: .35; cursor: default; filter: none; }
.send.stop { background: var(--text); color: var(--bg); }
.send.stop svg { fill: currentColor; stroke: none; width: 12px; height: 12px; }
.attachments-pending { display: flex; gap: 8px; padding: 10px 12px 0; }
.file-pill { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px 0 6px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--raised); font-size: 12.5px; }
.file-pill .fi { width: 24px; height: 24px; border-radius: 5px; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }

.hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 24px 8vh; }
.hero h1 { font-size: 26px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 6px; text-align: center; }
.hero p.sub { color: var(--muted); margin: 0 0 22px; text-align: center; font-size: 14.5px; }
.hero .dock-inner { width: 100%; }
.hero .composer textarea { min-height: 88px; font-size: 15px; padding: 16px 18px 8px; }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
.suggest button { height: 32px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--border); color: var(--muted); font-size: 13px; transition: border-color .12s, color .12s, background .12s; }
.suggest button:hover { border-color: var(--border-strong); color: var(--text); background: var(--hover); }

.inbox { border-left: 1px solid var(--border); background: var(--sidebar); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.ib-top { height: var(--topbar); flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 14px; }
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--radius); background: var(--hover); }
.seg button { height: 28px; padding: 0 12px; border-radius: var(--radius-sm); color: var(--muted); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 0 0 1px var(--border); }
.seg .count { font: 600 11px/1 var(--font-mono); color: var(--accent); }
.ib-top .spacer { flex: 1; }
.ib-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 12px 16px; }
.workbox { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); margin-bottom: 12px; overflow: hidden; }
.workbox-head { width: 100%; height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--muted); }
.workbox-head:hover { color: var(--text); }
.workbox-head .chev { width: 14px; height: 14px; margin-left: auto; transition: transform .15s var(--ease); }
.workbox.open .workbox-head .chev { transform: rotate(180deg); }
.workbox-list { display: none; border-top: 1px solid var(--border); padding: 4px; }
.workbox.open .workbox-list { display: block; }
.w-row { width: 100%; display: flex; align-items: flex-start; gap: 10px; padding: 8px; border-radius: var(--radius-sm); text-align: left; }
.w-row:hover { background: var(--hover); }
.w-row .spinner { margin-top: 3px; width: 12px; height: 12px; }
.w-row .wt { font-size: 13px; font-weight: 500; }
.w-row .wl { font-size: 12.5px; color: var(--muted); }
.w-row .we { margin-left: auto; font-size: 11.5px; color: var(--faint); font-family: var(--font-mono); padding-top: 1px; }
.tickets { display: flex; flex-direction: column; gap: 10px; }
.ticket { position: relative; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 12px 14px 12px; transition: border-color .15s, background .15s, opacity .25s var(--ease), transform .25s var(--ease); }
.ticket:hover, .ticket:focus-within { border-color: var(--border-strong); }
.ticket.leaving { opacity: 0; transform: translateX(16px); }
.t-head { display: flex; align-items: center; gap: 8px; height: 22px; margin-bottom: 6px; }
.kind { display: inline-flex; align-items: center; gap: 6px; }
.kind .dot { width: 6px; height: 6px; }
.k-question { color: var(--accent); } .k-question .dot { background: var(--accent); }
.k-approval { color: var(--warning); } .k-approval .dot { background: var(--warning); }
.k-result { color: var(--success); } .k-result .dot { background: var(--success); }
.k-blocked { color: var(--error); } .k-blocked .dot { background: var(--error); }
.k-fyi { color: var(--info); } .k-fyi .dot { background: var(--info); }
.t-src { color: var(--faint); font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-head .time { margin-left: auto; color: var(--faint); font-size: 12px; flex: none; }
.t-head .icon-btn { margin-right: -6px; }
.t-title { font-size: 13.5px; font-weight: 500; line-height: 1.35; margin: 0 0 3px; color: var(--muted); }

function applyTheme() {
  const t = THEMES[state.theme];
  const root = document.documentElement;
  root.dataset.mode = t.mode;
  root.removeAttribute('style');
  root.style.setProperty('--chat-width', state.chatWidth || '46rem');
  root.style.setProperty('--radius', (state.radius ?? 8) + 'px');
  for (const [k, v] of Object.entries(t.vars)) root.style.setProperty(k, v);
  for (const [k, v] of Object.entries(customVars)) root.style.setProperty(k, v);
  if (t.vars['--accent'] || customVars['--accent']) root.style.setProperty('--accent-soft', 'color-mix(in srgb, var(--accent) 16%, transparent)');
}

function toHex(value) {
  const c = document.createElement('canvas').getContext('2d');
  c.fillStyle = '#000';
  c.fillStyle = value;
  const v = c.fillStyle;
  if (v.startsWith('#')) return v;
  const m = v.match(/\d+(\.\d+)?/g);
  if (!m) return '#000000';
  return '#' + m.slice(0, 3).map((n) => Math.round(+n).toString(16).padStart(2, '0')).join('');
}

function renderWork(w, idx) {

function renderMessages() {
  const conv = conversations[state.chatId] || [];
  return conv.map((m, idx) => {
    if (m.role === 'user') {
      const quote = m.quote ? `<div class="quote">${ico('reply')}<div>${m.quote.kind ? `<b>${esc(m.quote.title)}</b> · ${esc(m.quote.text)}` : `“${esc(m.quote.text)}”`}</div></div>` : '';
      const att = m.attachment ? `<div class="attach-row"><div class="thumb"><div class="img"><div class="paper"><i></i><i style="width:70%"></i><i></i><i style="width:55%"></i><i></i><i style="width:80%"></i></div></div><div class="cap">${ico('img')}${esc(m.attachment)}</div></div></div>` : '';
      return `<div class="msg user">${att}<div class="bubble">${quote}${esc(m.text)}</div>${m.steered ? `<div class="user-meta">${ico('steer')} Steered into the running turn</div>` : state.toggles.timestamps && m.time ? `<div class="user-meta">${m.time}</div>` : ''}</div>`;

function findTicket(id) { return tickets.find((t) => t.id === id) || archive.find((a) => a.id === id); }

  const t = findTicket(id);
  if (!t) return;
  const k = KIND[t.kind];
  const groupName = GROUPS.find(([g]) => g === k.group)[1];

    <div class="d-body">
      <h2 id="dlgTitle">${esc(t.title)}</h2>
      <p class="d-need">${esc(t.need)}</p>
      <div class="d-sec"><div class="sl">What happened</div><p>${esc(t.ctx)}</p></div>
      <div class="d-sec"><div class="sl">Details</div><dl class="facts">${t.facts.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl></div>
      ${t.options && !isArchived ? `<div class="d-sec"><div class="sl">Pick one</div>${choicesHTML(t)}</div>` : ''}
      <div class="d-sec"><div class="sl">Sources</div><div class="sources">
        <button class="src">${ico('chat')}Session transcript<small>${esc(t.session)}</small></button>
        <button class="src">${ico('bot')}Job · ${esc(t.job)}<small>${esc(t.worker)}</small></button>
      </div></div>
    </div>
    <footer class="d-foot"><div class="to">${ico('reply')}Your reply goes to <b>${esc(current ? current.title : 'New chat')}</b> with this ticket attached</div>
      <div class="row"><div class="t-input"><textarea rows="1" id="dlgReply" placeholder="Reply…" aria-label="Reply"></textarea><button class="t-send" data-act="send-dialog" data-t="${t.id}" disabled aria-label="Send reply">${ico('up')}</button></div>
      ${isArchived ? '' : `<button class="btn" data-act="gotit" data-t="${t.id}">${ico('check')}Got it</button>`}</div></footer>
  </section></div>`;
  requestAnimationFrame(() => document.getElementById('backdrop').classList.add('show'));
  const ta = document.getElementById('dlgReply');
  ta.focus();
  autoGrow(ta);
}

function closeLayer() {
  const b = document.getElementById('backdrop');
  if (!b) return;
  b.classList.remove('show');
  setTimeout(() => { document.getElementById('layer').innerHTML = ''; }, 160);
}

function archiveTicket(id, how) {
  const t = tickets.find((x) => x.id === id);
  if (!t || t.archived) return;
  const card = document.querySelector(`.item[data-tid="${id}"]`);
  const done = () => {
    t.archived = true;
    t.how = how;
    t.time = 'now';
    const c = chats.find((x) => x.title === t.chat);
    if (c && c.status === 'needs' && !tickets.some((o) => !o.archived && o.chat === t.chat)) c.status = null;
    state.openItems.delete(id);
    const next = openTickets()[0];
    if (next && !openTickets().some((o) => state.openItems.has(o.id))) state.openItems.add(next.id);
    renderInbox();
    renderSidebar();
    renderMain();
  };
  if (card) { card.classList.add('leaving'); setTimeout(done, 220); } else done();
}

let toastTimer;
function toast(text, actionLabel, action) {
  const el = document.getElementById('toast');
  el.innerHTML = `<span>${text}</span>${actionLabel ? `<button id="toastAct">${actionLabel}</button>` : ''}`;
  el.classList.add('show');
  if (actionLabel) document.getElementById('toastAct').onclick = () => { action(); el.classList.remove('show'); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

function pushToChat(entry) {
  if (!conversations[state.chatId]) {
    const id = 'c' + Date.now();
    chats.unshift({ id, title: 'New chat', time: 'now' });
    conversations[id] = [];
    state.chatId = id;
  }
  conversations[state.chatId].push(entry);
}

function replyToTicket(id, text) {
  const t = findTicket(id);
  pushToChat({ role: 'user', text, time: now(), quote: { kind: t.kind, title: t.title, text: t.need } });
  const c = chats.find((x) => x.id === state.chatId);
  if (c && c.title === 'New chat') c.title = t.title;
  if (tickets.includes(t)) archiveTicket(id, 'Replied in chat');
  renderSidebar();
  renderMain();
  toast(`Replied in ${esc(c ? c.title : 'chat')}`, 'Undo', () => {});
}

function pickOption(id, i) {
  const t = findTicket(id);
  const choice = t.options[i][0];
  pushToChat({ role: 'note', icon: 'reply', html: `You answered <span class="t">${esc(t.title)}</span> with ${esc(choice)}` });
  closeLayer();
  archiveTicket(id, `Answered: ${choice}`);
  renderMain();
  toast(`Sent “${esc(choice)}” to the worker`);
}

function clock(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function now() { const d = new Date(); return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0'); }

function autoGrow(ta) {
  const fit = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, parseInt(getComputedStyle(ta).maxHeight) || 240) + 'px'; };
  ta.addEventListener('input', fit);
  fit();
}

function wireComposer() {
  const form = document.getElementById('composer');
  if (!form) return;
  const ta = document.getElementById('prompt');
  const send = document.getElementById('sendBtn');
  const stop = document.getElementById('stopBtn');
  autoGrow(ta);
  const sync = () => {
    const has = ta.value.trim().length > 0;
    send.disabled = !has;
    if (stop) { stop.style.display = has ? 'none' : ''; send.style.display = has ? '' : 'none'; }
  };
  ta.addEventListener('input', sync);
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      submit(e.metaKey || e.ctrlKey);
    }
  });
  form.addEventListener('submit', (e) => { e.preventDefault(); submit(false); });
  send.addEventListener('click', (e) => { if (e.metaKey || e.ctrlKey) { e.preventDefault(); submit(true); } });
  function submit(alt) {
    const text = ta.value.trim();
    if (!text) return;
    const running = state.running && state.chatId === 'dinner';
    const quote = state.replyQuote;
    state.replyQuote = null;
    if (running && alt) {
      (queued[state.chatId] = queued[state.chatId] || []).push(text);
      renderMain();
      toast('Queued for after this turn');
      return;
    }
    pushToChat({ role: 'user', text, time: now(), steered: running, quote });
    const c = chats.find((x) => x.id === state.chatId);
    if (c && c.title === 'New chat') c.title = text.length > 34 ? text.slice(0, 34) + '…' : text;
    const ack = openTickets().find((t) => text.toLowerCase().includes(t.title.split(' ').slice(-1)[0].toLowerCase()) || (/\b(ok|okay|got it|thanks|cool)\b/i.test(text) && t.kind === 'fyi'));
    renderAll();
    if (!running) {
      setTimeout(() => {
        if (ack && state.toggles.autoclose) {
          conversations[state.chatId].push({ role: 'note', icon: 'checkc', closed: true, html: `Closed <span class="t">${esc(ack.title)}</span> because you acknowledged it` });
          archiveTicket(ack.id, 'Closed from chat');
        }
        conversations[state.chatId].push({ role: 'assistant', work: work('Worked for 3s', 3, [{ icon: 'inbox', label: '<b>Read job cards</b>', meta: '0.2s', detail: 'job_cards {}' }]), html: `<p>${ack ? 'Noted, I\'ve closed that ticket.' : 'On it. I\'ll post a ticket when there\'s something for you to check.'}</p>` });
        renderMain();
      }, 700);
    }
  }
}

function wireSelectionReply() {
  const btn = document.getElementById('selReply');
  btn.innerHTML = `${ico('reply')}Reply`;
  document.addEventListener('mouseup', () => {
    setTimeout(() => {
      const sel = window.getSelection();
      const text = sel && sel.toString().trim();
      const node = sel && sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
      if (!text || !node || !node.closest('.say')) { btn.style.display = 'none'; return; }
      const r = sel.getRangeAt(0).getBoundingClientRect();
      btn.style.display = 'inline-flex';
      btn.style.left = Math.round(r.left + r.width / 2 - 36) + 'px';
      btn.style.top = Math.round(r.top - 38) + 'px';
      btn.onclick = () => { state.replyQuote = { text: text.length > 140 ? text.slice(0, 140) + '…' : text }; btn.style.display = 'none'; sel.removeAllRanges(); renderMain(); document.getElementById('prompt').focus(); };
    }, 0);
  });
  document.addEventListener('scroll', () => { btn.style.display = 'none'; }, true);
}

}
function selectRow(title, desc, value) {
  return `<div class="srow"><div class="sl"><b>${title}</b><span>${desc}</span></div><button class="select">${value}${ico('down')}</button></div>`;
}

function settingsPage() {
  const p = state.settingsPage;
  if (p === 'general') return `
    <div class="s-section"><h3>Notifications</h3><div class="card">
      ${selectRow('Ticket notifications', 'A system notification when a new ticket arrives, while Ozi is open on this device.', 'All tickets')}
      ${toggleRow('badge', 'Dock badge', 'Show the number of open tickets on the app icon.')}
      ${toggleRow('sound', 'Sound', 'Play a short sound for questions and approvals.')}
    </div></div>
    <div class="s-section"><h3>Inbox</h3><div class="card">
      ${toggleRow('autoclose', 'Close tickets from chat', 'When you acknowledge a ticket in the chat, Ozi closes it and notes it in the conversation.')}
      ${toggleRow('workingRow', 'Working row', 'Show running jobs at the top of the inbox.')}
      ${selectRow('Replies go to', 'Where a reply typed on a ticket is posted.', 'The chat you\'re in')}
    </div></div>
    <div class="s-section"><h3>Confirmations</h3><div class="card">
      ${toggleRow('confirmArchive', 'Archive confirmation', 'Ask before Got it moves a ticket to the archive.')}
    </div></div>`;
  if (p === 'appearance') {
    const card = (id) => {
      const t = THEMES[id];
      const v = (k, d) => t.vars[k] || d;
      const dark = t.mode === 'dark';
      const bg = v('--bg', dark ? '#000' : '#fcfcfc'), sb = v('--sidebar', dark ? '#101010' : '#f7f7f8'), msg = v('--message', dark ? '#1c1c1c' : '#f0f0f2'), acc = v('--accent', dark ? 'oklch(0.571 0.21 264)' : 'oklch(0.488 0.217 264)'), tx = v('--text', dark ? '#f5f5f5' : '#18181b');
      return `<button class="theme-card ${state.theme === id ? 'on' : ''}" data-theme="${id}" aria-pressed="${state.theme === id}"><div class="pv" style="background:${bg}"><div class="ps" style="background:${sb}"><i style="background:${tx}"></i><i style="background:${tx};width:70%"></i><i style="background:${tx};width:85%"></i></div><div class="pm"><i style="background:${msg};width:60%"></i><i style="background:${tx};opacity:.5;width:90%"></i><i style="background:${tx};opacity:.5;width:75%"></i><i style="background:${acc};width:22%;margin-top:auto"></i></div></div><div class="nm">${t.name}<small>${t.mode === 'dark' ? 'Dark' : 'Light'}</small></div></button>`;
    };
    const cs = getComputedStyle(document.documentElement);
    return `
    <div class="s-section"><h3>Theme</h3><div class="themes">${Object.keys(THEMES).map(card).join('')}</div></div>
    <div class="s-section"><h3>Interface</h3><div class="card">
      <div class="srow"><div class="sl"><b>Corner radius</b><span>Squarer or rounder controls, cards and windows.</span></div><input class="slider" type="range" min="2" max="14" step="1" value="${state.radius ?? 8}" data-range="radius" aria-label="Corner radius"></div>
      <div class="srow"><div class="sl"><b>Chat width</b><span>How wide messages and the composer can grow on large screens.</span></div><input class="slider" type="range" min="36" max="64" step="1" value="${parseInt(state.chatWidth || '46')}" data-range="chatWidth" aria-label="Chat width"></div>
      ${toggleRow('timestamps', 'Message times', 'Show the time under your messages.')}
    </div></div>
    <div class="s-section"><h3>Advanced colors</h3><div class="card">
      <div class="srow"><div class="sl"><b>Use advanced theme colors</b><span>Edit every color of the current theme. Changes apply as you pick them.</span></div><button class="toggle ${state.advanced ? 'on' : ''}" role="switch" aria-checked="${state.advanced}" aria-label="Use advanced theme colors" data-act="toggle-advanced"></button></div>
      ${state.advanced ? `<div class="tokens" style="border-top:1px solid var(--border)">${EDITABLE.map(([k, n]) => { const hex = toHex(cs.getPropertyValue(k).trim()); return `<div class="token"><span class="sw" style="background:${hex}"><input type="color" value="${hex}" data-token="${k}" aria-label="${n}"></span><label>${n}</label><code>${hex}</code></div>`; }).join('')}</div>` : ''}
    </div></div>`;
  }
  if (p === 'chat') return `<div class="s-section"><h3>Sending</h3><div class="card">
      ${selectRow('While Ozi is working', 'What Enter does when a turn is running. ⌘Enter does the other.', 'Steer')}
      ${selectRow('Default model', 'Used for new chats.', 'Opus 5.5 · High')}
      ${toggleRow('timestamps', 'Message times', 'Show the time under your messages.')}
    </div></div>`;
  if (p === 'keys') {
    const rows = [['New chat', ['⌘', 'N']], ['Search chats', ['/']], ['Settings', ['⌘', ',']], ['Toggle sidebar', ['⌘', 'B']], ['Toggle inbox', ['⌘', 'I']], ['Queue while working', ['⌘', 'Enter']], ['Pick a ticket option', ['1', '2', '3']], ['Close window', ['Esc']]];
    return `<div class="s-section"><h3>Shortcuts</h3><div class="card"><table class="kb-table">${rows.map(([n, k]) => `<tr><td>${n}</td><td>${k.map((x) => `<span class="kbd">${x}</span>`).join('')}</td></tr>`).join('')}</table></div></div>`;
  }
  if (p === 'providers') {
    const prov = [['Pi', 'Pi', 'Main agent · claude-bridge/claude-opus-5-5', true], ['Cx', 'Codex', 'Default worker · gpt-6.1-sol', false], ['Cl', 'Claude', 'Worker · Opus 5.5', true]];
    return `<div class="s-section"><h3>Providers</h3><div class="card">${prov.map(([a, n, d, ok]) => `<div class="srow"><div class="prov"><span class="pi">${a}</span><div class="sl"><b>${n}</b><span>${d}</span></div></div><span class="spacer" style="flex:1"></span><span class="state">${ico(ok ? 'check' : 'info')}${ok ? 'Ready' : 'Sign-in needed'}</span><button class="btn">${ok ? 'Manage' : 'Sign in'}</button></div>`).join('')}</div></div>`;
  }
  if (p === 'schedules') return `<div class="s-section"><h3>Scheduled tasks</h3><div class="card">
      <div class="srow"><div class="sl"><b>Weekly inbox digest</b><span>Every Thursday at 08:00 · last ran today</span></div><button class="toggle on" role="switch" aria-checked="true" aria-label="Weekly inbox digest"></button></div>
      <div class="srow"><div class="sl"><b>Bills check</b><span>On the 25th of every month at 09:00</span></div><button class="toggle on" role="switch" aria-checked="true" aria-label="Bills check"></button></div>
      <div class="srow"><div class="sl"><b>Package tracking</b><span>Webhook · when a shipping email arrives</span></div><button class="toggle" role="switch" aria-checked="false" aria-label="Package tracking"></button></div>
    </div></div>`;
  if (p === 'env') return `<div class="s-section"><h3>Server</h3><div class="card">
      <div class="srow"><div class="sl"><b>home-server</b><span>100.64.0.1:4747 · connected through Tailscale</span></div><span class="state">${ico('check')}Connected</span></div>
      <div class="srow"><div class="sl"><b>Pair another device</b><span>Create a one-time link to sign in on a new device.</span></div><button class="btn">Create link</button></div>
      <div class="srow"><div class="sl"><b>Terminal command</b><span>Install <span class="mono">ozi</span> on this Mac's PATH.</span></div><button class="btn">Install</button></div>
    </div></div>`;
  return `<div class="s-section"><h3>${PAGE_NAMES[p]}</h3><div class="card"><div class="srow"><div class="sl"><b>Same as T3 Code</b><span>This page keeps T3's settings for ${PAGE_NAMES[p].toLowerCase()}, trimmed to what Ozi uses.</span></div></div></div></div>`;
}

function renderSettingsBody() {
  const nav = SETTINGS_NAV.map(([g, items]) => `${g ? `<div class="s-group" style="font-size:12px;font-weight:500">${g}</div>` : '<div style="height:6px"></div>'}${items.map(([id, n, ic]) => `<button class="s-item ${state.settingsPage === id ? 'on' : ''}" data-page="${id}">${ico(ic)}${n}</button>`).join('')}`).join('');
  document.getElementById('sNav').innerHTML = `<label class="sb-search">${ico('search')}<input placeholder="Search settings" aria-label="Search settings"><span class="kbd">/</span></label>${nav}`;
  document.getElementById('sHead').innerHTML = `<span class="crumb">Settings &nbsp;/&nbsp; <b>${PAGE_NAMES[state.settingsPage]}</b></span><span class="spacer"></span><button class="pill-btn" data-act="restore">${ico('reset')}Restore defaults</button><button class="icon-btn" data-act="close-layer" aria-label="Close settings (Esc)">${ico('x')}</button>`;
  document.getElementById('sContent').innerHTML = settingsPage();
}

function openSettings(page) {
  if (page) state.settingsPage = page;
  document.getElementById('layer').innerHTML = `<div class="backdrop" id="backdrop" data-act="close-layer"><section class="settings" role="dialog" aria-modal="true" aria-label="Settings"><nav class="s-nav" id="sNav"></nav><div class="s-main"><header class="s-head" id="sHead"></header><div class="s-scroll"><div class="s-content" id="sContent"></div></div></div></section></div>`;
  renderSettingsBody();
  requestAnimationFrame(() => document.getElementById('backdrop').classList.add('show'));
}

document.addEventListener('click', (e) => {
  const t = e.target;
  if (t.id === 'backdrop') { closeLayer(); return; }
  const chatBtn = t.closest('[data-chat]');
  if (chatBtn) { state.chatId = chatBtn.dataset.chat; state.replyQuote = null; renderSidebar(); renderMain(); return; }
  const tab = t.closest('[data-tab]');
  if (tab) { state.inboxTab = tab.dataset.tab; renderInbox(); return; }
  const page = t.closest('[data-page]');
  if (page) { state.settingsPage = page.dataset.page; renderSettingsBody(); return; }
  const th = t.closest('[data-theme]');
  if (th) { state.theme = th.dataset.theme; customVars = {}; applyTheme(); renderSettingsBody(); return; }
  const tg = t.closest('[data-toggle]');
  if (tg) { const k = tg.dataset.toggle; state.toggles[k] = !state.toggles[k]; renderSettingsBody(); renderInbox(); if (k === 'timestamps') renderMain(); return; }
  const sug = t.closest('[data-suggest]');
  if (sug) { const p = document.getElementById('prompt'); p.value = sug.dataset.suggest; p.dispatchEvent(new Event('input')); p.focus(); return; }
  const chip = t.closest('.job-chip');
  if (chip) { openTicket(chip.dataset.ticket); return; }
  const a = t.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;
  if (act === 'close-layer') { if (a.id === 'backdrop' && t !== a) return; closeLayer(); }
  else if (act === 'toggle-sidebar') { state.showSidebar = !state.showSidebar; document.getElementById('app').classList.toggle('no-sidebar', !state.showSidebar); renderMain(); }
  else if (act === 'toggle-inbox') { state.showInbox = !state.showInbox; document.getElementById('app').classList.toggle('no-inbox', !state.showInbox); renderMain(); }
  else if (act === 'new-chat') { state.chatId = null; state.replyQuote = null; renderSidebar(); renderMain(); document.getElementById('prompt').focus(); }
  else if (act === 'settings') openSettings();
  else if (act === 'toggle-work') { a.closest('.work').classList.toggle('open'); a.setAttribute('aria-expanded', a.closest('.work').classList.contains('open')); }
  else if (act === 'toggle-step') a.closest('.step').classList.toggle('open');
  else if (act === 'toggle-item') { const id = a.dataset.t; state.openItems.has(id) ? state.openItems.delete(id) : state.openItems.add(id); renderInbox(); }
  else if (act === 'toggle-working') { state.workingOpen = !state.workingOpen; renderInbox(); }
  else if (act === 'open-ticket') openTicket(a.dataset.t);
  else if (act === 'gotit') { closeLayer(); archiveTicket(a.dataset.t, 'Got it'); toast('Moved to the archive', 'Undo', () => { const x = tickets.find((y) => y.id === a.dataset.t); x.archived = false; renderInbox(); }); }
  else if (act === 'pick') pickOption(a.dataset.t, +a.dataset.i);
  else if (act === 'send-reply') { const ta = document.querySelector(`textarea[data-reply="${a.dataset.t}"]`); if (ta.value.trim()) replyToTicket(a.dataset.t, ta.value.trim()); }
  else if (act === 'send-dialog') { const ta = document.getElementById('dlgReply'); if (ta.value.trim()) { closeLayer(); replyToTicket(a.dataset.t, ta.value.trim()); } }
  else if (act === 'reply-msg') { const m = conversations[state.chatId][+a.dataset.idx]; const text = a.closest('.msg').querySelector('.say').innerText.trim(); state.replyQuote = { text: text.length > 140 ? text.slice(0, 140) + '…' : text }; renderMain(); document.getElementById('prompt').focus(); }
  else if (act === 'copy') toast('Copied');
  else if (act === 'clear-quote') { state.replyQuote = null; renderMain(); }
  else if (act === 'stop') { state.running = false; const c = chats.find((x) => x.id === 'dinner'); c.status = null; const conv = conversations.dinner; const last = conv[conv.length - 1]; last.running = false; last.work.running = false; last.work.label = 'Stopped after ' + state.runSecs + 's'; renderAll(); toast('Stopped'); }
  else if (act === 'q-remove') { queued[state.chatId].splice(+a.dataset.i, 1); renderMain(); }
  else if (act === 'q-steer') { const text = queued[state.chatId].splice(+a.dataset.i, 1)[0]; conversations[state.chatId].push({ role: 'user', text, steered: true }); renderMain(); }
  else if (act === 'q-edit') { const text = queued[state.chatId].splice(+a.dataset.i, 1)[0]; renderMain(); const p = document.getElementById('prompt'); p.value = text; p.dispatchEvent(new Event('input')); p.focus(); }
  else if (act === 'toggle-advanced') { state.advanced = !state.advanced; renderSettingsBody(); }
  else if (act === 'restore') { state.theme = 'default-dark'; customVars = {}; state.radius = 8; state.chatWidth = '46rem'; applyTheme(); renderSettingsBody(); renderMain(); toast('Restored defaults'); }
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'chatSearch') { state.sidebarQuery = t.value; const pos = t.selectionStart; renderSidebar(); const n = document.getElementById('chatSearch'); n.focus(); n.setSelectionRange(pos, pos); }
  if (t.id === 'archSearch') { state.archiveQuery = t.value; const pos = t.selectionStart; renderInbox(); const n = document.getElementById('archSearch'); n.focus(); n.setSelectionRange(pos, pos); }
  if (t.dataset.reply) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; t.parentElement.querySelector('.t-send').disabled = !t.value.trim(); }
  if (t.id === 'dlgReply') t.parentElement.querySelector('.t-send').disabled = !t.value.trim();
  if (t.dataset.token) { customVars[t.dataset.token] = t.value; applyTheme(); t.closest('.token').querySelector('code').textContent = t.value; t.parentElement.style.background = t.value; }
  if (t.dataset.range === 'radius') { state.radius = +t.value; applyTheme(); }
  if (t.dataset.range === 'chatWidth') { state.chatWidth = t.value + 'rem'; applyTheme(); }
});

document.addEventListener('keydown', (e) => {
  const inField = e.target.matches('textarea, input');
  if (e.key === 'Escape') { if (document.getElementById('backdrop')) { closeLayer(); return; } if (state.running && state.chatId === 'dinner' && !inField) document.querySelector('[data-act="stop"]')?.click(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'n') { e.preventDefault(); document.querySelector('[data-act="new-chat"]').click(); }
  if ((e.metaKey || e.ctrlKey) && e.key === ',') { e.preventDefault(); openSettings(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); document.querySelector('[data-act="toggle-sidebar"]').click(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'i') { e.preventDefault(); document.querySelector('[data-act="toggle-inbox"]').click(); }
  if (e.key === 'Enter' && !e.shiftKey && e.target.dataset && e.target.dataset.reply) { e.preventDefault(); e.target.parentElement.querySelector('.t-send').click(); }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'dlgReply') { e.preventDefault(); e.target.parentElement.querySelector('.t-send').click(); }
  if (!inField && e.key === '/') { e.preventDefault(); document.getElementById('chatSearch')?.focus(); }
  if (!inField && /^[1-3]$/.test(e.key)) {
    const scope = document.querySelector('.dialog') || document.querySelector('.item.open:hover') || document.querySelector('.item.open:focus-within') || document.querySelector('.item.open');
    const opt = scope && scope.querySelectorAll('.opt')[+e.key - 1];
    if (opt) { e.preventDefault(); opt.click(); }
  }
});

setInterval(() => {
  if (!state.running) return;
  state.runSecs++;
  const te = document.getElementById('topElapsed');
  if (te) te.textContent = `Working ${clock(state.runSecs)}`;
  const s = document.querySelector('.work.running .work-toggle .shimmer');
  if (s) s.textContent = `Working · ${state.runSecs}s`;
}, 1000);

applyTheme();
renderAll();
wireSelectionReply();
</script>
</body>
</html>
