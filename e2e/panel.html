<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ozi panel preview</title>
    <style>
      :root {
        --background: #fbfaf8;
        --foreground: #1d1d1f;
        --card: #fff;
        --muted: #f3f1ec;
        --muted-foreground: #7a776f;
        --border: #e2e0da;
        --primary: #2f6bff;
        --primary-foreground: #fff;
        --destructive: #c4391b;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
      }
      button {
        background: none;
        border: 0;
        color: inherit;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      button:focus-visible {
        outline: 2px solid #2f6bff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/panel.tsx"></script>
  </body>
</html>
